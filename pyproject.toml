[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synadm-tui"
version = "0.22"
description = "Terminal-Oberflaeche fuer die Matrix-Synapse-Administration mit synadm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "synadm-tui contributors" }]
classifiers = [
  "Environment :: Console :: Curses",
  "Programming Language :: Python :: 3",
]

[project.scripts]
synadm-tui = "synadm_tui.cli:main"
synadm-tui-thueringen = "synadm_tui_thueringen.cli:main"

[tool.setuptools.packages.find]
include = ["synadm_tui*"]

[tool.setuptools.package-data]
synadm_tui = ["assets/*.png", "assets/*.block.json"]
synadm_tui_thueringen = ["assets/*.png", "assets/*.block.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
